# zettair-summariser config — copy to config.toml on a fresh Mac Mini.
# config.toml is gitignored so each machine carries its own.

[prod]
# SSH-able host that holds the queue. The user must be `sparky` (or
# an equivalent) with key auth set up.
ssh_host = "sparky@zettair-prod"

# Remote directories that hold the queue. These are owned by zettair
# on prod with group `summariser`; sparky is in that group.
remote_pending  = "/mnt/wikipedia-source/summaries/pending"
remote_priority = "/mnt/wikipedia-source/summaries/priority"
remote_done     = "/mnt/wikipedia-source/summaries/done"
remote_errors   = "/mnt/wikipedia-source/summaries/errors"

[local]
# Where the worker stages files on the Mac Mini. setup.sh creates these.
inbox           = "~/zettair-summariser-data/inbox"
priority_inbox  = "~/zettair-summariser-data/priority-inbox"
inbox_processed = "~/zettair-summariser-data/inbox-processed"
outbox          = "~/zettair-summariser-data/outbox"
errors_outbox   = "~/zettair-summariser-data/errors-outbox"
logs            = "~/zettair-summariser-data/logs"

[model]
# v1 supports two backends:
#   "stub"  → echo a deterministic placeholder summary (M4 stub).
#   "ollama"→ call a local ollama server.
backend = "stub"

# Used when backend = "ollama". Override per-machine if you run a
# different model. The default is reasonable for an M1/M2 Mac Mini
# with 16GB RAM.
ollama_url   = "http://localhost:11434"
ollama_model = "llama3.1:8b-instruct-q4_K_M"

# Per-doc text cap when assembling the prompt. 6 KB ≈ 1500 tokens; with
# top_m=3 the prompt comes in around 4500 tokens, which keeps
# prompt-processing latency low on 4B-8B models. Bump to 12 KB if you
# switch to a 32B+ model and want more context per doc.
per_doc_cap_bytes = 6000

# How many top-M documents from the job to include in the prompt.
# 3 is the sweet spot for head queries — the top 3 docs almost always
# carry the canonical article + 1-2 supporting refs.
top_m = 3

# Generous ceiling on output tokens. We rely on prompt.parse_summary's
# word-count check to reject over-runs and let the ollama backend retry;
# we never ship a mid-sentence truncation. 350 ≈ 260 words, plenty of
# headroom for a well-behaved 100-word body + 5 bullets.
max_output_tokens = 350

[poll]
# How long to sleep between rsync sweeps when poll.py is invoked
# in --daemon mode. The launchd plist also fires it on a timer.
interval_seconds = 120

# Max jobs to process per sweep. Keeps a single sweep bounded.
max_jobs_per_sweep = 25

# Push completed summaries to prod every N jobs (instead of only at
# the end of the sweep). At 2-4 min per generation, a full 25-job
# sweep takes 50-100 min; without intermediate pushes, prod sees
# nothing for that whole window. Default 5 = pushes every ~10-15 min.
push_every = 5
